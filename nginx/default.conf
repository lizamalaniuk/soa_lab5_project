
server {
    listen 80;
    resolver 127.0.0.11 valid=1s ipv6=off;

    location /api/users/ {
        set $backend 'users:8000';
        rewrite ^/api/users/(.*)$ /users/$1 break;
        proxy_pass http://$backend;
    }

    location = /api/users {
        set $backend 'users:8000';
        proxy_pass http://$backend/users;
    }

    location /api/homeworks/ {
        set $backend 'homework:8000';
        rewrite ^/api/homeworks/(.*)$ /homeworks/$1 break;
        proxy_pass http://$backend;
    }

    location = /api/homeworks {
        set $backend 'homework:8000';
        proxy_pass http://$backend/homeworks;
    }

    location = /api/notifications {
        set $backend 'notifications:8000';
        proxy_pass http://$backend/notifications;
    }

    location = /health {
        return 200 'API Gateway OK\n';
    }
    location = /oauth/login {
        set $backend 'oauth:8000';
        proxy_pass http://$backend/login$is_args$args;
    }

    location = /oauth/callback {
        set $backend 'oauth:8000';
        proxy_pass http://$backend/callback$is_args$args;
    }

    location = /oauth/status {
        set $backend 'oauth:8000';
        proxy_pass http://$backend/status;
        proxy_set_header Cookie $http_cookie;
    }
}
